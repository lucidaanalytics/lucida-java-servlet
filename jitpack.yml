# JitPack's own Maven is older than the 3.6.3 the pinned plugins need: use Maven 3.9.9.
# This module depends on the base Java SDK (io.github.lucidaanalytics:lucida), which is not on Maven Central yet: build it first.
jdk:
  - openjdk17
before_install:
  - curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz | tar -xz -C /tmp
  - git clone --depth 1 --branch v0.1.2 https://github.com/lucidaanalytics/lucida-java /tmp/lucida-java
  - /tmp/apache-maven-3.9.9/bin/mvn -B -ntp -f /tmp/lucida-java/pom.xml install -DskipTests -Dgpg.skip -Dmaven.javadoc.skip=true
install:
  - /tmp/apache-maven-3.9.9/bin/mvn -B -ntp install -DskipTests -Dgpg.skip -Dmaven.javadoc.skip=true
